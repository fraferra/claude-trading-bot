[build-system]
requires = ["setuptools>=68.0", "setuptools-scm>=8.0"]
build-backend = "setuptools.build_meta"

[project]
name = "claude-trading-bot"
version = "0.1.0"
description = "LLM-powered trading bot for stocks (Alpaca) and prediction markets (Polymarket)"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.42.0",
    "alpaca-py>=0.33.0",
    "py-clob-client>=0.34.0",
    "yfinance>=0.2.40",
    "pydantic>=2.7.0",
    "pyyaml>=6.0",
    "python-dotenv>=1.0.0",
    "rich>=13.7.0",
    "click>=8.1.0",
    "httpx>=0.27.0",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "aiosqlite>=0.20.0",
    "websockets>=13.0",
    "kalshi-python>=0.4.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23.0",
]

[project.scripts]
trading-bot = "trading_bot.main:cli"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
