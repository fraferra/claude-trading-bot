# Claude Trading Bot Configuration

# Trading mode: "paper" or "live"
mode: paper

# LLM settings
llm:
  model: claude-sonnet-4-5-20250929          # Default for all agents
  strategist_model: claude-opus-4-6  # Opus for weekly strategy review
  max_tokens: 4096

# Risk management
risk:
  max_position_pct: 0.10        # Max 10% of portfolio per position
  max_total_exposure_pct: 0.80  # Max 80% total invested
  daily_loss_limit_pct: 0.03    # Stop trading if daily loss > 3%
  min_confidence: 0.60          # Reject decisions below 60% confidence
  max_trades_per_day: 50        # Max trades per day (arb strategies are hedged)

# Alpaca settings
alpaca:
  paper: true
  # Data feed: "iex" (free) or "sip" (paid, requires subscription)
  data_feed: iex

# Polymarket settings
polymarket:
  paper: false  # Live mode — falls back to paper if credentials missing
  paper_balance: 10000.0  # Starting virtual USDC balance (used as fallback)

# Stock analysis defaults
stocks:
  default_period: 3mo     # Default lookback period for price data
  watchlist:
    - AAPL
    - MSFT
    - GOOGL
    - AMZN
    - NVDA
    - TSLA
    - META
    - SPY

# Continuous run settings
run:
  interval_minutes: 30
  auto_execute: false  # Require confirmation for each trade

# Strategy configurations
strategies:
  arbitrage:
    min_edge_pct: 0.02          # 2% minimum edge after fees
    fee_estimate_pct: 0.01      # 1% estimated fee per leg
    max_events_to_scan: 200
    max_size_per_leg_usd: 500.0
    min_days_to_resolution: 0   # 0 = no minimum
    max_days_to_resolution: 0   # 0 = no limit (set >0 to focus on short-term)
  cross_market:
    min_edge_pct: 0.03          # 3% minimum divergence
    max_markets_per_batch: 20   # Batch size for LLM calls
    max_pairs_to_analyze: 50
    max_size_usd: 300.0
  probability_edge:
    min_edge_pct: 0.10          # 10% minimum AI vs market edge
    kelly_fraction_cap: 0.25    # Quarter-Kelly for safety
    max_size_usd: 500.0
    track_accuracy: true

# Kalshi prediction market settings
kalshi:
  demo: false  # Set to true for demo-api.kalshi.co, false for production
  scan_interval_minutes: 45
  max_events_to_scan: 100
  min_edge_pct: 0.08
  kelly_fraction_cap: 0.20
  max_size_usd: 200.0
  max_total_exposure_usd: 2000.0
  max_positions: 15
  categories:
    - politics
    - economics
    - science
    - climate
    - finance
  max_days_until_close: 90    # Only trade markets closing within 90 days

# Cross-platform arbitrage: Polymarket ↔ Kalshi spread detection
cross_platform_arb:
  enabled: true
  scan_interval_minutes: 2          # Scan every 2 minutes
  min_net_edge_pct: 0.02            # 2% net after fees
  min_volume_usd: 10000.0           # Only trade markets with $10K+ volume
  max_size_per_leg_usd: 200.0       # $200 per leg (Poly + Kalshi)
  max_total_exposure_usd: 2000.0    # Max $2K cross-platform exposure
  fuzzy_match_threshold: 0.75       # Market name similarity score
  market_cache_ttl_seconds: 3600    # Re-match markets hourly
  min_days_to_resolution: 1
  max_days_to_resolution: 60        # Avoid far-future markets (capital lockup)
  fee_estimate_poly_pct: 0.0        # Polymarket maker fee (0%)
  fee_estimate_kalshi_pct: 0.02     # Kalshi fee estimate (~2% at 50%)

# Kalshi MECE arbitrage (pure math, no LLM)
# Targets range/bucket events (Fed rate, CPI, etc.) where sum of YES prices != $1.00
kalshi_arb:
  enabled: true
  scan_interval_minutes: 10
  min_edge_pct: 0.03          # 3% net edge after fees
  fee_estimate_pct: 0.01      # ~1% per leg
  max_events_to_scan: 200
  min_markets: 3              # Min legs for a MECE event
  max_markets: 15             # Skip events with too many buckets
  max_size_per_leg_usd: 50.0  # $50 per leg
  max_total_exposure_usd: 300.0  # Max $300 total per cycle

# OU-based market regime classifier
# Fits an Ornstein-Uhlenbeck process to daily crypto bars.
# Results gate signal thresholds and position sizes in crypto_momentum.
regime:
  enabled: true
  scan_interval_minutes: 60      # Re-classify every hour
  lookback_bars: 200             # Daily bars fetched (~6.5 months)
  autocorr_window: 60            # Bars for lag-1 autocorrelation
  vol_window: 30                 # Bars per rolling realized-vol estimate
  trend_threshold: 0.08          # Min |ρ| to declare trending/mean-reverting
  vol_high_pct: 0.75             # Vol percentile → HIGH_VOLATILITY
  vol_low_pct: 0.25              # Vol percentile → LOW_VOLATILITY
  symbols: []                    # Empty = use crypto.watchlist

# Crypto momentum strategy
crypto:
  scan_interval_minutes: 15
  watchlist:
    - BTC/USD
    - ETH/USD
    - SOL/USD
    - AVAX/USD
    - LINK/USD
  bar_timeframe: 15Min
  lookback_bars: 100
  min_signal_score: 0.6
  max_position_pct: 0.08
  max_total_exposure_pct: 0.50
  max_size_usd: 1000.0
  llm_confirmation_enabled: true

# Short selling (human-in-the-loop)
shorts:
  enabled: true
  scan_interval_minutes: 60
  watchlist: []                    # Empty = broad market scan (S&P 500 + NASDAQ-100)
  min_short_score: -0.4            # More negative = stronger signal needed
  max_short_exposure_pct: 0.30     # Max 30% of portfolio in shorts
  max_single_short_pct: 0.05       # Max 5% per short position
  risk_per_trade_pct: 0.005        # 0.5% risk per trade
  stop_atr_multiplier: 2.5         # Stop loss = entry + 2.5x ATR
  proposal_expiry_hours: 24        # Proposals expire after 24h
  broad_market_scan: true          # Scan full S&P 500 + NASDAQ-100
  prefilter_rsi_min: 65.0          # Pre-filter: RSI(14) above this
  prefilter_near_high_pct: 0.95    # Pre-filter: price > 95% of 3-month high
  max_prefilter_candidates: 40     # Max candidates after pre-filter

# Drawdown-based accumulation (leveraged ETFs)
drawdown_accumulation:
  enabled: true
  scan_interval_minutes: 60
  watchlist:
    - TQQQ                          # 3x NASDAQ-100
    - SOXL                          # 3x Semiconductors
    - UPRO                          # 3x S&P 500
  normal_buy_usd: 300.0             # Small DCA buy in normal conditions
  drawdown_buy_usd: 1500.0          # Aggressive buy when drawdown >= threshold
  drawdown_threshold_pct: 25.0      # 252-day drawdown % to trigger aggressive buys
  min_days_between_buys: 7          # Cooldown between normal buys
  min_days_between_drawdown_buys: 5 # Cooldown between drawdown buys
  drawdown_lookback_days: 252       # ~1 year lookback for max drawdown
  profit_take_pct: 50.0             # Take profit when position up 50%+
  profit_take_fraction: 0.25        # Sell 25% of position on profit-take
  max_portfolio_pct: 0.30           # Max 30% of portfolio in this strategy

# Position guard (auto stop-loss, trailing stop, take-profit)
position_guard:
  enabled: true
  scan_interval_minutes: 5
  stop_loss_pct: 8.0             # Hard stop: sell if down 8%
  trailing_stop_pct: 12.0        # Trailing stop from peak price
  take_profit_pct: 25.0          # Take profit when up 25%
  partial_take_profit: true      # Sell partial at TP (not full position)
  partial_take_fraction: 0.50    # Sell 50% of position at TP
  exclude_symbols: []            # Symbols to skip (e.g., TQQQ managed by drawdown strategy)
  enable_for_shorts: true

# Weather forecast arbitrage (NOAA data vs Polymarket weather markets)
weather_arb:
  enabled: true
  scan_interval_minutes: 30     # Scan every 30 minutes
  min_edge_pct: 0.08            # 8% edge between NOAA and market required
  max_days_to_resolution: 7     # Only trade markets resolving within 7 days
  min_days_to_resolution: 1     # Skip markets expiring today
  max_size_usd: 100.0           # $100 max per position
  max_total_exposure_usd: 500.0 # $500 max total weather exposure
  min_volume_usd: 1000.0        # Skip markets with < $1K liquidity
  cities:                       # Cities to match against NOAA forecasts
    - new york
    - los angeles
    - chicago
    - houston
    - phoenix
    - seattle
    - miami
    - boston
    - dallas
    - denver
    - san francisco
    - atlanta
    - washington dc

# Telegram notifications (set TELEGRAM_BOT_TOKEN and TELEGRAM_CHAT_ID env vars)
telegram:
  enabled: false
  notify_trades: true
  notify_errors: true
  notify_stop_loss: true
  daily_summary: true
  daily_summary_hour: 17

# Temporal momentum arbitrage (Binance spot price lag vs Polymarket crypto binary markets)
temporal_momentum:
  paper: false                        # Use live broker (falls back to paper if no credentials)
  scan_interval_seconds: 2            # Inner loop cadence
  max_minutes_to_expiry: 480.0        # Up to 8 hours — catches end-of-day crypto markets
  min_minutes_to_expiry: 5.0          # Avoid markets about to expire
  min_edge_pct: 0.08                  # 8% edge (down from 15%)
  momentum_strength_threshold: 0.50   # 0.5 composite score (down from 0.65)
  min_price_change_1m_pct: 0.002      # 0.2% 1-min move (down from 0.3%)
  max_size_usd: 200.0                 # $200 max per trade
  max_total_exposure_usd: 2000.0      # $2K max total exposure
  min_volume_usd: 5000.0              # $5K min market volume
  frontrun_enabled: false             # Disable front-running for now

# Autonomous research agent
research_agent:
  scan_interval_minutes: 240    # Run pipeline every 4 hours
  max_candidates: 20            # Max stocks to discover per cycle
  max_positions: 10             # Max portfolio positions
  max_single_position_pct: 0.15 # 15% max per stock
  min_cash_reserve_pct: 0.20    # Keep 20% cash
  rebalance_drift_threshold: 0.05  # 5% drift triggers rebalance
  min_research_score: 5.0       # Min score to consider (1-10)
  strategy_review_day: sunday   # Weekly review day
  enabled: true
